name: Dalia browser E2E

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/**'
      - 'sw.js'
      - 'tests/**'
      - '.github/workflows/e2e.yml'
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/**'
      - 'sw.js'
      - 'tests/**'
      - '.github/workflows/e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright browser driver
        run: npm install --no-save --no-package-lock playwright-core
      - name: Run real Chromium user journeys
        run: |
          export CHROME_PATH="$(command -v google-chrome || command -v chromium || true)"
          if [ -z "$CHROME_PATH" ]; then echo "Chromium/Chrome not installed"; exit 1; fi
          node tests/e2e.mjs
      - name: Install CJK fonts for accurate Chinese rendering
        if: github.event_name == 'workflow_dispatch'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
      - name: Audit design across desktop and mobile screens
        if: github.event_name == 'workflow_dispatch'
        run: |
          export CHROME_PATH="$(command -v google-chrome || command -v chromium || true)"
          node tests/design-audit.mjs
      - name: Check published daliastudy.ru in Chromium
        continue-on-error: true
        run: |
          export CHROME_PATH="$(command -v google-chrome || command -v chromium || true)"
          node tests/live-smoke.mjs
      - name: Attach failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dalia-e2e-failure-screenshots
          path: test-results/
          if-no-files-found: ignore

  safari-webkit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright WebKit and its OS dependencies
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps webkit
      - name: Test Safari engine with desktop and iPhone simulations
        run: node tests/safari-webkit.mjs
      - name: Attach WebKit failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dalia-webkit-failures
          path: test-results/
          if-no-files-found: ignore

  native-safari:
    runs-on: macos-15
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enable Apple Safari WebDriver
        run: |
          safaridriver --version
          sudo safaridriver --enable
      - name: Install Selenium WebDriver
        run: npm install --no-save --no-package-lock selenium-webdriver
      - name: Exercise site in actual desktop Safari
        run: node tests/native-safari.mjs
